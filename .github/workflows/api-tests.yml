name: ServeRest API tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start isolated ServeRest
        run: npx --yes serverest@3.2.2 > serverest.log 2>&1 &
      - name: Wait for API
        run: until curl --fail http://localhost:3000/usuarios; do sleep 1; done
      - name: Run Smoke collection
        run: npx --yes newman run postman/ServeRest-smoke.postman_collection.json --reporters cli
      - name: Run negative collection
        run: npx --yes newman run postman/ServeRest-negative.postman_collection.json --reporters cli
